<svg width="1200" height="980" viewBox="0 0 1200 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="980" fill="#F5EFE6"/>
  <rect x="32" y="28" width="1136" height="924" rx="28" fill="#FFFDF8" stroke="#E6D9C7" stroke-width="2"/>
  <text x="72" y="90" fill="#7A4B2A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="2">PIPELINE SHOWCASE</text>
  <text x="72" y="138" fill="#1F2328" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">From ARM64 control flow to readable pseudo-Dart</text>
  <text x="72" y="172" fill="#5A6573" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Built from the checked-in structured_loop_emit fixture, so the example stays versioned with the repo.</text>

  <rect x="72" y="214" width="238" height="36" rx="18" fill="#FFF4E8" stroke="#F1C79A"/>
  <text x="100" y="237" fill="#9A5D22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">1  Equivalent source intent</text>
  <rect x="344" y="214" width="175" height="36" rx="18" fill="#F8F2FF" stroke="#D7C3F3"/>
  <text x="373" y="237" fill="#6C4CA6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">2  ARM64 fragment</text>
  <rect x="553" y="214" width="146" height="36" rx="18" fill="#EFF8F4" stroke="#B7DEC8"/>
  <text x="583" y="237" fill="#206A46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">3  Function IR</text>
  <rect x="733" y="214" width="218" height="36" rx="18" fill="#EAF4FF" stroke="#BDD8F8"/>
  <text x="761" y="237" fill="#165C9A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">4  Recovered pseudocode</text>

  <path d="M318 232H336" stroke="#C98B53" stroke-width="3" stroke-linecap="round"/>
  <path d="M527 232H545" stroke="#8E6CC8" stroke-width="3" stroke-linecap="round"/>
  <path d="M707 232H725" stroke="#4AA06B" stroke-width="3" stroke-linecap="round"/>

  <rect x="72" y="286" width="500" height="292" rx="24" fill="#FFF9F0" stroke="#ECD9BB" stroke-width="2"/>
  <text x="100" y="327" fill="#9A5D22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Equivalent Dart source</text>
  <text x="100" y="355" fill="#7E6C5F" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">This is the human-readable intent for the same loop shape.</text>
  <rect x="100" y="382" width="444" height="164" rx="18" fill="#FFFDF8" stroke="#E6D9C7"/>
  <text x="126" y="419" fill="#CF222E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">int</text>
  <text x="163" y="419" fill="#0550AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">?</text>
  <text x="181" y="419" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24"> incrementUntilNonZero(</text>
  <text x="504" y="419" fill="#CF222E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" text-anchor="end">int</text>
  <text x="511" y="419" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24"> receiver) {</text>
  <text x="126" y="454" fill="#CF222E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">while</text>
  <text x="196" y="454" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24"> (</text>
  <text x="220" y="454" fill="#CF222E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">true</text>
  <text x="274" y="454" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">) {</text>
  <text x="126" y="489" fill="#CF222E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">  final</text>
  <text x="214" y="489" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24"> next </text>
  <text x="279" y="489" fill="#0550AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">=</text>
  <text x="303" y="489" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24"> receiver </text>
  <text x="408" y="489" fill="#0550AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">+</text>
  <text x="432" y="489" fill="#0550AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24"> 1</text>
  <text x="460" y="489" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">;</text>
  <text x="126" y="524" fill="#CF222E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">  if</text>
  <text x="172" y="524" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24"> (next </text>
  <text x="253" y="524" fill="#0550AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">!=</text>
  <text x="289" y="524" fill="#0550AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24"> 0</text>
  <text x="319" y="524" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">) { return next; }</text>

  <rect x="606" y="286" width="522" height="292" rx="24" fill="#FBF7FF" stroke="#E0D0F0" stroke-width="2"/>
  <text x="634" y="327" fill="#6C4CA6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Binary-level shape</text>
  <text x="634" y="355" fill="#7E6C90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">The same logic before structuring: branch edges first, semantics later.</text>
  <rect x="634" y="382" width="218" height="164" rx="18" fill="#FFFDF8" stroke="#D7C3F3"/>
  <text x="659" y="416" fill="#8E6CC8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">ARM64</text>
  <text x="659" y="451" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">0xd000  b    #0xd004</text>
  <text x="659" y="481" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">0xd004  add  x0, x0, #1</text>
  <text x="659" y="511" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">0xd008  cbnz x0, #0xd010</text>
  <text x="659" y="541" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">0xd00c  b    #0xd004</text>

  <rect x="876" y="382" width="224" height="164" rx="18" fill="#F7FCF9" stroke="#B7DEC8"/>
  <text x="901" y="416" fill="#206A46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Function IR</text>
  <text x="901" y="451" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">bb0 -&gt; bb1</text>
  <text x="901" y="479" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">  jump   b #0xd004</text>
  <text x="901" y="507" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">bb1 -&gt; bb2, bb3</text>
  <text x="901" y="535" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">  branch cbnz #0xd010</text>

  <rect x="72" y="610" width="1056" height="268" rx="24" fill="#F4F8FF" stroke="#C9DCF7" stroke-width="2"/>
  <text x="100" y="651" fill="#165C9A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Recovered pseudo-Dart</text>
  <text x="100" y="679" fill="#61758A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">What lands in pseudocode/*.dartpseudo once the CFG has been structured back into a readable loop.</text>
  <rect x="100" y="706" width="1000" height="140" rx="18" fill="#FFFDF8" stroke="#BDD8F8"/>
  <text x="126" y="742" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">dynamic goldenSimpleLoop(int receiver, dynamic param1, dynamic param2, dynamic param3,</text>
  <text x="126" y="772" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">    dynamic param4, dynamic param5, dynamic param6, dynamic param7) {</text>
  <text x="126" y="802" fill="#CF222E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">  while</text>
  <text x="190" y="802" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"> (true) { if ((receiver + 1) != 0) { </text>
  <text x="620" y="802" fill="#CF222E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">return</text>
  <text x="689" y="802" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"> (receiver + 1); } continue; }</text>

  <text x="100" y="912" fill="#7A4B2A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">How to validate a real APK result</text>
  <text x="100" y="938" fill="#5A6573" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Inspect asm/*.s for branch shape, confirm the CFG in ir/*.json, then trust pseudocode/*.dartpseudo only as far as the earlier layers agree.</text>
</svg>
