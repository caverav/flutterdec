<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.0//EN" "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg width="740" height="368" xmlns="http://www.w3.org/2000/svg">
<rect width="738" height="366" fill="#282a36" rx="18" ry="18" stroke="#26304f" stroke-width="1" x="0.5" y="0.5"/>
<g font-family="monospace" font-size="17" fill="#f8f8f2">
<text x="24" y="63" xml:space="preserve"><tspan fill="#8be9fd">Widget</tspan> _buildPingBadge(<tspan fill="#8be9fd">int</tspan>? ping) {</text>
<text x="24" y="87" xml:space="preserve">  <tspan fill="#ff79c6">if</tspan> (ping == <tspan fill="#8be9fd">null</tspan>) <tspan fill="#ff79c6">return</tspan> <tspan fill="#8be9fd" font-style="italic">const</tspan> SizedBox(width: <tspan fill="#bd93f9">50</tspan>);</text>
<text x="24" y="123" xml:space="preserve">  <tspan fill="#ff79c6">return</tspan> Container(</text>
<text x="24" y="147" xml:space="preserve">    constraints: <tspan fill="#8be9fd" font-style="italic">const</tspan> BoxConstraints(minWidth: <tspan fill="#bd93f9">50</tspan>),</text>
<text x="24" y="171" xml:space="preserve">    padding: <tspan fill="#8be9fd" font-style="italic">const</tspan> EdgeInsets.symmetric(horizontal: <tspan fill="#bd93f9">8</tspan>, vertical: <tspan fill="#bd93f9">4</tspan>),</text>
<text x="24" y="195" xml:space="preserve">    decoration: BoxDecoration(</text>
<text x="24" y="219" xml:space="preserve">      color: AppTheme.getPingColor(ping).withOpacity(<tspan fill="#bd93f9">0.15</tspan>),</text>
<text x="24" y="243" xml:space="preserve">      borderRadius: BorderRadius.circular(<tspan fill="#bd93f9">8</tspan>),</text>
<text x="24" y="267" xml:space="preserve">    ),</text>
<text x="24" y="291" xml:space="preserve">    child: Text(ping &gt;= <tspan fill="#bd93f9">0</tspan> ? <tspan fill="#f1fa8c">'${ping}ms'</tspan> : <tspan fill="#f1fa8c">'Fail'</tspan>),</text>
<text x="24" y="315" xml:space="preserve">  );</text>
<text x="24" y="339" xml:space="preserve">}</text>
</g>
<svg x="0" y="0"><circle cx="13.5" cy="12" r="5.5" fill="#FF5A54"/><circle cx="32.5" cy="12" r="5.5" fill="#E6BF29"/><circle cx="51.5" cy="12" r="5.5" fill="#52C12B"/></svg>
</svg>
