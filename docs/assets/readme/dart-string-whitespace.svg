</text><text x="24.00px" y="158.00px" xml:space="preserve">  <tspan fill="#ff79c6">if</tspan> (codeUnit <tspan fill="#ff79c6">&lt;</tspan> <tspan fill="#bd93f9">0x85</tspan>) <tspan fill="#ff79c6">return</tspan> <tspan fill="#ff79c6">false</tspan>;
