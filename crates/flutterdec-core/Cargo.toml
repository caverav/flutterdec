[package]
name = "flutterdec-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Serialization-span visibility for the benchmark harness. Off in every product
# build. Forwards to the decompiler so one flag turns on both nested spans and
# a partially instrumented graph is not expressible.
bench-spans = ["flutterdec-decompiler/bench-spans"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
goblin.workspace = true
capstone.workspace = true
cpp_demangle.workspace = true
zip.workspace = true
tempfile.workspace = true
dex.workspace = true
dalvik.workspace = true
flutterdec-loader = { path = "../flutterdec-loader" }
flutterdec-adapter = { path = "../flutterdec-adapter" }
flutterdec-disasm-arm64 = { path = "../flutterdec-disasm-arm64" }
flutterdec-ir = { path = "../flutterdec-ir" }
flutterdec-decompiler = { path = "../flutterdec-decompiler" }
