name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Release artifacts are built with a plain toolchain, NOT `nix develop`.
      # Building inside the dev shell links against /nix/store paths, which do
      # not exist on user machines: every release up to v0.1.0-alpha.3 shipped
      # a Linux binary whose ELF interpreter was a /nix/store glibc, and a
      # macOS binary loading /nix/store libiconv. Both failed to start off Nix.
      # CI checks still use Nix; only packaging is plain.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tooling
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools musl-dev

      # Serwalker ships inside the archive: stage-release-prefix.sh bundles the
      # executable and pins its digest into the staged registry with the
      # bundle_registry tool, so all three are built for the same target.
      - name: Build release CLI and bundled Serwalker
        run: >-
          cargo build -p flutterdec-cli -p flutterdec-serwalker --release
          --bins --example bundle_registry --target ${{ matrix.target }}

      - name: Verify artifact is portable
        shell: bash
        run: |
          set -euo pipefail
          for name in flutterdec flutterdec-serwalker; do
            bin="target/${{ matrix.target }}/release/$name"
            if [ "${{ runner.os }}" = "Linux" ]; then
              # musl static-pie: `file` reports "static-pie linked". Anything
              # dynamic would name an ELF interpreter, which is exactly the
              # /nix/store breakage this guard exists to catch.
              if ! file "$bin" | grep -q 'static'; then
                echo "::error::expected a static binary: $name"
                file "$bin"
                exit 1
              fi
            else
              if otool -L "$bin" | grep -q '/nix/store'; then
                echo "::error::binary links against /nix/store: $name"
                otool -L "$bin"
                exit 1
              fi
            fi
            "$bin" --version
          done

      # The archive carries a prefix, not a lone binary. Runtime discovery is
      # executable-relative: the CLI reads its compatibility registry, runtime
      # profiles and packaged producer from `<exe dir>/../share/flutterdec`, so
      # an archive holding only `flutterdec` extracts into a CLI that cannot
      # resolve any of them without a source checkout.
      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          os="${{ runner.os }}"
          arch="${{ runner.arch }}"
          out_dir="dist"
          mkdir -p "$out_dir"
          archive="$out_dir/flutterdec-${{ github.ref_name }}-${os}-${arch}.tar.gz"
          ./scripts/stage-release-prefix.sh \
            "target/${{ matrix.target }}/release/flutterdec" stage
          tar -C stage -czf "$archive" bin share
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Verify archive runs off a checkout
        shell: bash
        run: ./scripts/release-layout-smoke.sh "${{ env.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: flutterdec-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.archive }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
