name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build release CLI
        run: nix develop -c cargo build -p flutterdec-cli --release

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          os="${{ runner.os }}"
          arch="${{ runner.arch }}"
          out_dir="dist"
          mkdir -p "$out_dir"
          bin_name="flutterdec"
          archive="$out_dir/flutterdec-${{ github.ref_name }}-${os}-${arch}.tar.gz"
          tar -C target/release -czf "$archive" "$bin_name"
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: flutterdec-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.archive }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
