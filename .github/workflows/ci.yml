name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust:
    name: Rust Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Validate flake
        run: nix flake check

      - name: Format
        run: nix develop -c cargo fmt --all --check

      - name: Lint shell scripts
        run: nix develop -c ./scripts/lint-shell.sh

      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      # Named targets, not --workspace: `autotests = false` or a deleted file
      # would leave --workspace passing with a quietly smaller suite.
      - name: Oracle loader guard
        run: nix develop -c cargo test -p flutterdec-decompiler --test provenance_audit --test loop_entry_provenance_audit

      - name: Test
        run: nix develop -c cargo test --workspace

      - name: Build release CLI
        run: nix develop -c cargo build -p flutterdec-cli --release
